[package]
name = "probelab-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Tauri desktop vertical slice for ProbeLab"

[lib]
name = "probelab_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "probelab-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The `test` feature only gates `tauri::test` (mock runtime, headless IPC
# invocation) and pulls no extra dependencies. Declared here rather than in
# `[dependencies]` so test builds exercise the native command path while
# release builds carry nothing test-only.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Direct access for the native command tests, which seed managed state with a
# real `LabRunner` run rather than hand-built fixtures.
probelab-core = { path = "../../../crates/core" }
probelab-engine = { path = "../../../crates/engine" }
probelab-evaluator = { path = "../../../crates/evaluator" }
probelab-lab = { path = "../../../crates/lab" }

[features]
# Permits an explicitly provided scratch directory for the database, and nothing else.
#
# Off by default and absent from a shipped build, so the production storage path contains no branch that
# an environment variable alone could reach. With it on, the application refuses to start unless
# PROBELAB_TEST_DATA_DIR names an absolute directory that is not the platform's application-data
# directory - there is no fallback, because falling back is how a test harness ends up writing into
# someone's real archive.
test-harness = []

[dependencies]
probelab-agent = { path = "../../../crates/agent" }
probelab-benchmarks = { path = "../../../crates/benchmarks" }
probelab-core = { path = "../../../crates/core" }
probelab-engine = { path = "../../../crates/engine" }
probelab-evaluator = { path = "../../../crates/evaluator" }
probelab-executors = { path = "../../../crates/executors" }
probelab-tasks = { path = "../../../crates/tasks" }
probelab-lab = { path = "../../../crates/lab" }
probelab-model-adapters = { path = "../../../crates/model-adapters" }
probelab-telemetry = { path = "../../../crates/telemetry" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
# Single-instance protection. Two instances share one SQLite database in one app-data
# directory, and the second would reconcile the first's in-flight runs as interrupted
# while they were still executing. A half-recorded match that looks complete is the
# worst outcome this tool could produce, so the second instance refuses to start.
tauri-plugin-single-instance = "2.5.3"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
