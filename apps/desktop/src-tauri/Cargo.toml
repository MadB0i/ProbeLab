[package]
name = "probelab-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Tauri desktop vertical slice for ProbeLab"

[lib]
name = "probelab_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "probelab-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
probelab-agent = { path = "../../../crates/agent" }
probelab-benchmarks = { path = "../../../crates/benchmarks" }
probelab-core = { path = "../../../crates/core" }
probelab-engine = { path = "../../../crates/engine" }
probelab-evaluator = { path = "../../../crates/evaluator" }
probelab-lab = { path = "../../../crates/lab" }
probelab-model-adapters = { path = "../../../crates/model-adapters" }
probelab-telemetry = { path = "../../../crates/telemetry" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
