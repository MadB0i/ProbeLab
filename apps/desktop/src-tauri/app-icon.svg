<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ProbeLab">
  <!--
    App icon: the Signal Aperture on a machined navy tile.

    The mark itself is container-free; the tile exists because operating systems put icons on surfaces
    (taskbar chrome, desktop, installer pages) that the product does not control. A rounded tile with a
    restrained vertical light-fall reads as a single instrument face at 16px and disappears as a shape
    at 256px, leaving the mark. Tile radius 112 (22%) — enough to clear OS masking, square enough to
    stay an instrument rather than a pebble.

    THE STEM IS WHITE HERE, NOT NAVY. The master mark's stem is #172B39 because it sits on light
    surfaces; laid over a #172B39 tile it rendered as a near-black slab that swallowed the bowl's
    stem-side edge and turned the P into a blob at 16px. The tile inverts the ink, not the geometry.
    Geometry is byte-identical to the master, which is what the drift test checks.
  -->
  <title>ProbeLab</title>
  <defs>
    <linearGradient id="tileface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3547"/>
      <stop offset="0.55" stop-color="#172B39"/>
      <stop offset="1" stop-color="#12222E"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tileface)"/>
  <g id="stem">
    <path d="M 148 388 L 148 156 Q 148 128 176 128 L 196 128 Q 224 128 224 156 L 224 388 Q 224 408 204 408 L 168 408 Q 148 408 148 388 Z" fill="#F4F8FB"/>
  </g>
  <g id="aperture-bowl">
    <path d="M 210.8 98.7 A 126 126 0 0 1 340.8 271.2 L 275.9 245.0 A 56 56 0 0 0 218.1 168.3 Z" fill="#2563EB"/>
    <path d="M 290.8 330.9 A 126 126 0 0 1 210.8 349.3 L 218.1 279.7 A 56 56 0 0 0 253.7 271.5 Z" fill="#2563EB"/>
  </g>
  <g id="probe-needle">
    <line x1="346.6" y1="326.8" x2="271.5" y2="263.9" stroke="#00C6CC" stroke-width="28" stroke-linecap="round"/>
  </g>
  <g id="measurement-node">
    <circle cx="244" cy="216" r="28" fill="#00C6CC"/>
  </g>
</svg>
