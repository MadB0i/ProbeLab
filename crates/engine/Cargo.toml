[package]
name = "probelab-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Adapter-neutral deterministic benchmark execution engine for ProbeLab"

[dependencies]
# The arena matches a tested model against a trusted reference policy, so it needs the reference
# strategy trait in production rather than only in tests.
probelab-agent = { path = "../agent" }
probelab-broker = { path = "../broker" }
probelab-core = { path = "../core" }
probelab-sandbox = { path = "../sandbox" }
probelab-telemetry = { path = "../telemetry" }
# `Interval` reaches result bundles and the lab's read model, so the harness types are serialised in
# production rather than only in tests.
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
probelab-benchmarks = { path = "../benchmarks" }
probelab-evaluator = { path = "../evaluator" }
probelab-model-adapters = { path = "../model-adapters" }
rusqlite.workspace = true
serde_json.workspace = true
tokio.workspace = true
wiremock.workspace = true
