name: CI

# The gate this workflow exists to be. Everything below is a check that has failed for real, or a
# check whose absence let something real through. `docs/STATUS.md` section 9 lists the same commands
# with their expected results, so the two cannot disagree about what "passing" means.

on:
  push:
  pull_request:

jobs:
  verify:
    name: Build, lint, test, and audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.lock
          command: check
      # `cargo-deny-action` runs the policy in `deny.toml`, but duplicate detection is deliberately
      # `warn` -- the Tauri tree carries two majors of `windows-sys`, `thiserror`, and `toml` that
      # ProbeLab does not own -- and a warn-level lint does not fail an action. This step requires a
      # clean exit instead, so a policy set to warn still fails the build. A gate that can be configured
      # into silence is not a gate, and the interesting part of a supply-chain check is the failures.
      - name: Require a clean supply-chain policy
        run: cargo deny --log-level error check
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # `--all` rather than the bare form. The workspace root is a *virtual* manifest, so bare `cargo
      # fmt` already covers every member and `--all` is equivalent -- but the explicit form states the
      # intent, and the bare form would silently cover less if the manifest ever stopped being virtual.
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint the Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # `--all-targets` because a test target that does not compile is not a passing test suite, and
      # `--all-features` so a feature-gated path cannot rot unnoticed.
      - name: Test the Rust workspace
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Build the Rust workspace
        run: cargo build --workspace --all-features --locked
      - name: Test the frontend
        # Previously absent, which meant the frontend suite was never run by CI at all. A gate that
        # silently skips half the tests is worse than no gate, because it reads as coverage.
        run: pnpm test
        working-directory: apps/desktop
      - name: Build the frontend
        run: pnpm build
        working-directory: apps/desktop
      - name: Enforce the legibility floor and the contrast contract
        # Asserts no rendered font size falls below 11px, in both `px` and `rem`. The floor used to
        # live only in a CSS comment that claimed it was satisfied while 58 rules were under it --
        # the original check matched `px` and not `rem`, and this stylesheet mixes both. A comment
        # cannot fail, so it is a script now.
        #
        # `check:styles` also runs the contrast contract. `--ink-3` and `--ink-4` shipped at 2.72:1 on
        # a tinted chip and 3.06:1 on a panel, across sixty rules, because they were tuned against the
        # panel they were designed in and never measured against the tints and hover states they also
        # appear on. Nothing failed because the accessibility audit only ever visited two routes, and
        # those two happened to be clean. The tokens now carry the guarantee and this gate holds them
        # to it against every surface in the palette.
        run: pnpm check:styles
        working-directory: apps/desktop
      - name: Validate the Tauri packaging configuration
        # `tauri build` is the only thing in this project that reads `tauri.conf.json`, and it is the
        # one step that produces installers, so it runs last, by hand, and never on CI. A misspelled
        # key in that file therefore survived every gate here and surfaced as a failed release build.
        # This validates it against the schema that ships inside `@tauri-apps/cli` -- read from
        # node_modules, not fetched, so it cannot drift from the version actually in use -- and asserts
        # the production properties the schema cannot express: no development-server origin in the
        # shipped CSP, no `unsafe-eval` in either policy, `freezePrototype` on, and bundle metadata
        # present so the installer does not ship with an empty publisher.
        run: node scripts/check-tauri-config.mjs
        working-directory: apps/desktop
      - name: Check version provenance
        # The version lives in the workspace manifest, the Tauri config, and the frontend manifest.
        # Cargo stamps the first into the binary and Tauri stamps the second into the installer, so a
        # disagreement ships an application and an installer that report different versions. This also
        # reads the version claims out of `docs/STATUS.md`, which is how the stale `0.4.1` in that
        # document was found.
        run: python3 scripts/check-version-provenance.py
      - name: Check the app icons match their source
        # `app-icon.svg` used to be referenced by nothing: a file that looked like the icon source and
        # was not one, so editing it changed nothing a user would see. `pnpm icons` regenerates every
        # platform size from it; this fails if the SVG and the generated outputs drift apart, which is
        # the way that file becomes dead again.
        run: pnpm check:icons
        working-directory: apps/desktop
      - name: Check the cross-language fixtures match live serialization
        # The Brain panel's frontend fixtures were hand-written from `api.ts`, which is how two wire
        # bugs survived a full audit: a finding's `is_security_finding` flag and a tagged
        # `terminalReason` object both disagreed with the consumer while every test was green. The
        # fixtures are now emitted by the backend and pinned against it.
        run: cargo test --locked -p probelab-lab --all-features --test emit_fixture
      - name: Check the feature matrix is current
        # Reads the REAL `generate_handler![]` list and the real `invoke` calls in the frontend, and
        # fails in both directions. The previous version grepped `#[tauri::command]`, which marks a
        # definition rather than a registration -- so nine commands that were defined, exported, called
        # by the UI, tested, and documented were absent from the handler, leaving three panels dead in
        # the built application while this check passed. A gate that reads the wrong list is worse
        # than no gate, because it reads as coverage.
        run: python3 scripts/check-feature-matrix.py
      - name: Audit wire-format stability
        # A serialization defect once shipped as `SecurityProbe` where the wire format is
        # `security_probe`: nothing broke at run time, because both ends agreed, and the only
        # evidence was a person reading JSON. `wire_format.rs` pins the field names and enum
        # spellings against hand-written literals, so a rename fails here instead of reaching a
        # stored row.
        #
        # The target name is used rather than an `--exact` filter. A previous filter here was
        # `--exact security::serialization`, which matched zero tests and passed. A gate that can
        # silently stop testing anything is worse than no gate, because it reads as coverage -- and
        # deleting the file would empty the step rather than fail it.
        run: cargo test --locked --workspace --all-features --test wire_format
      - name: Audit the IPC boundary
        # Malformed payloads, invalid enums, invalid numbers, missing state, poisoned state, backend
        # failure, and serialization failure. The frontend is untrusted input, so the boundary is
        # tested with what a stale, buggy, or hostile build actually sends. Named as a target for the
        # same reason as the step above.
        run: cargo test --locked -p probelab-desktop --all-features --test ipc_boundary
      - name: Audit the adversarial self-tests
        # Live loopback servers that misbehave: redirects, truncated bodies, multi-megabyte
        # responses, silence, and a credential the provider echoes back. Plus the replay-corruption
        # surface and the distinction the whole security story rests on -- a blocked probe is a
        # passing test, and a model that violates the boundary is a finding.
        run: cargo test --locked -p probelab-lab --all-features --test adversarial
      - name: Audit comparison honesty
        # The comparison feature's risk is not a wrong number, it is a confident number about runs
        # that were never comparable. These tests assert the refusals and the absence handling
        # directly, so a change that makes the comparison more permissive fails visibly. They also
        # assert that broker refusals alone are not a security finding, which was once the case.
        run: cargo test --locked -p probelab-lab --all-features --test comparison
      - name: Audit structural security guarantees
        # The architectural tests that assert the Brain, Runner, Arena, and Replay cannot authorize,
        # execute, or bypass enforcement. Run as a named step so a failure reads as a security
        # regression rather than as an ordinary test failure.
        run: |
          cargo test -p probelab-lab --locked --test runner not_a_security_authority
          cargo test -p probelab-lab --locked --test arena the_arena_is_not_a_capability_authority
          cargo test -p probelab-lab --locked --test replay replay_holds_no_execution_or_authorization_capability
          cargo test -p probelab-sandbox --locked --test containment_identity
          cargo test -p probelab-model-adapters --locked --test provider_boundary
          cargo test -p probelab-desktop --locked --lib security::tests::no_command_can_declare_a_breach_or_reclassify_an_outcome
          cargo test -p probelab-desktop --locked --lib arena::tests::no_command_can_steer_an_authorization_or_a_result
          cargo test -p probelab-desktop --locked --lib brain::tests::no_command_can_override_an_authorization_decision
          cargo test -p probelab-desktop --locked --lib tests::every_command_the_frontend_invokes_is_registered
      - name: Fail on any step error
        run: echo "all gate steps passed"

  containment-windows:
    name: Windows OS containment
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.lock
          command: check
      - name: Require a clean supply-chain policy
        run: cargo deny --log-level error check
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test Windows OS containment
        # 30 tests, 9 of which launch a real child under a real AppContainer identity. These are the
        # only checks of the OS-level guarantees in `docs/STATUS.md` section 3, and they cannot run
        # anywhere else.
        run: cargo test -p probelab-sandbox --locked
      - name: Lint Windows OS containment
        run: cargo clippy -p probelab-sandbox --all-targets --all-features --locked -- -D warnings
      - name: Audit Windows process identity isolation
        # The spawner always requests an AppContainer identity and fails closed without one. These are
        # the tests that hold that guarantee in place, and they only run on Windows because that is
        # where the containment code is live.
        run: cargo test -p probelab-sandbox --locked --test containment_identity
        continue-on-error: false
      - name: Test the Rust workspace
        # `--exclude probelab-desktop` on the build step below: Tauri needs webview2 and the Linux
        # system libraries, and a Windows runner has webview2 but not a configured build target for
        # the desktop binary's link step. The desktop *library* is still tested above, because every
        # command surface and the IPC boundary target live in it.
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Lint the Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build the Rust workspace
        run: cargo build --workspace --all-features --locked --exclude probelab-desktop
