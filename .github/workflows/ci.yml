name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build Rust workspace
        run: cargo build --workspace --locked
      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

  containment-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Test Windows OS containment
        run: cargo test -p probelab-sandbox --locked
      - name: Lint Windows OS containment
        run: cargo clippy -p probelab-sandbox --all-targets --locked -- -D warnings
      - name: Test the Rust workspace
        run: cargo test --workspace --locked --exclude probelab-desktop
      - name: Lint the Rust workspace
        run: cargo clippy --workspace --all-targets --locked --exclude probelab-desktop -- -D warnings
      - name: Build the Rust workspace
        run: cargo build --workspace --locked --exclude probelab-desktop
