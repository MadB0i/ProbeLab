[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/agent",
    "crates/model-adapters",
    "crates/sandbox",
    "crates/broker",
    "crates/telemetry",
    "crates/evaluator",
    "crates/benchmarks",
    "crates/engine",
    "crates/lab",
    "crates/executors",
    "crates/tasks",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/MadB0i/ProbeLab"
# Not published, and not publishable as written: every member depends on its siblings by `path`, which
# crates.io rejects. Declaring `publish = false` states that rather than leaving it implied, and it is
# also what lets `deny.toml`'s `allow-wildcard-paths` apply -- cargo-deny only grants that exemption to
# crates that are not published, because a published crate cannot have a path dependency at all.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is enabled deliberately. Without it serde_json's writer and parser can disagree by
# one unit in the last place on some values, so a stored measurement can come back subtly different from
# the one recorded. This repository stores f64 scores, Wilson interval bounds, and replay digests in
# result bundles, so a 1-ULP drift is a real defect in recorded data rather than a rounding detail.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.9"
rand_chacha = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
wiremock = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
