<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ProbeLab: the Signal Aperture">
  <!--
    THE SIGNAL APERTURE — monochrome, dark ink. Single colour throughout.

    An abstract precision aperture combined with a probing signal. Read it three ways, all intended:

      stem    the laboratory's structure (midnight navy) — the grounded bar everything hangs off
      bowl    the aperture: a blade-built P bowl, open at a wedge mouth on its right flank
              (electric blue) — the measurement chamber, deliberately not closed
      needle  the probe signal entering through the mouth (precision cyan)
      node    the measurement itself, resting in the counter of the P (precision cyan)

    WHY IT IS DRAWN THIS WAY
    - The P is a negative-space structure: the counter (the hole the node sits in) is the letter's
      eye, so the product's initial is formed by absence rather than by outline. Nothing here is a
      letter placed inside a container.
    - The bowl is a 156-degree arc, not a ring: there are no full circles anywhere, concentric or
      otherwise. The wedge mouth is a real gap in the path geometry, so it survives monochrome,
      16px rasterisation, and embossing alike.
    - The needle stops at the counter's edge. It enters; it does not exit. A needle crossing the
      whole composition would read as a Q-tail or a magnifier handle.
    - Four shapes total. Anything a fifth shape would say is said by the space between these four.

    CONSTRUCTION
    All coordinates derive from: stem x 148-224, bowl centre (224,224) R126/56, mouth 22-58deg,
    needle along the 40deg ray, node (252,216) r32. The content box is x 148-361 / y 99-408,
    centred on (254.5, 253.5) — within 2px of the canvas centre in both axes.
  -->
  <title>ProbeLab Signal Aperture</title>
  <desc>A navy stem and blue aperture bowl form a P; a cyan probe needle enters through the bowl's open mouth toward a cyan measurement node resting in the P's eye.</desc>
  <g id="stem">
    <path d="M 148 388 L 148 156 Q 148 128 176 128 L 196 128 Q 224 128 224 156 L 224 388 Q 224 408 204 408 L 168 408 Q 148 408 148 388 Z" fill="#172B39"/>
  </g>
  <g id="aperture-bowl">
    <path d="M 210.8 98.7 A 126 126 0 0 1 340.8 271.2 L 275.9 245.0 A 56 56 0 0 0 218.1 168.3 Z" fill="#172B39"/>
    <path d="M 290.8 330.9 A 126 126 0 0 1 210.8 349.3 L 218.1 279.7 A 56 56 0 0 0 253.7 271.5 Z" fill="#172B39"/>
  </g>
  <g id="probe-needle">
    <line x1="346.6" y1="326.8" x2="271.5" y2="263.9" stroke="#172B39" stroke-width="28" stroke-linecap="round"/>
  </g>
  <g id="measurement-node">
    <circle cx="244" cy="216" r="28" fill="#172B39"/>
  </g>
</svg>
